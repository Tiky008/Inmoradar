name: InmoRadar - Buscador de Departamentos

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'seen_listings.json'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      override_ciudad:
        description: 'Ciudad (Dejalo vacio para usar tu config.yaml)'
        required: false
        default: ''
      override_zonas:
        description: 'Zonas separadas por coma (Opcional)'
        required: false
        default: ''
      override_precio_max:
        description: 'Precio maximo (Opcional)'
        required: false
        default: ''
      override_personas:
        description: 'Numero de personas (Opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  buscar-departamentos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos automaticamente
        run: |
          find . -maxdepth 3 -iname "requirements.txt" ! -path "./requirements.txt" -exec cp {} ./requirements.txt \;
          find . -maxdepth 3 -iname "config.yaml" ! -path "./config.yaml" -exec cp {} ./config.yaml \;
          find . -maxdepth 3 -iname "main.py" ! -path "./main.py" -exec cp {} ./main.py \;

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Motor InmoRadar
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OVERRIDE_CIUDAD: ${{ github.event.inputs.override_ciudad }}
          OVERRIDE_ZONAS: ${{ github.event.inputs.override_zonas }}
          OVERRIDE_PRECIO_MAX: ${{ github.event.inputs.override_precio_max }}
          OVERRIDE_PERSONAS: ${{ github.event.inputs.override_personas }}
        run: python main.py

      - name: Guardar historial de departamentos vistos
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f seen_listings.json ]; then
            git add seen_listings.json
            git diff --staged --quiet || git commit -m "chore: actualizar historial [skip ci]"
            git push
          fi
          
